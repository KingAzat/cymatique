<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cymatique 3D — Plaque de Chladni</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0e14; font-family: "Segoe UI", system-ui, sans-serif; color: #dce3ee; }
  #app { position: relative; width: 100%; height: 100%; }
  canvas { display: block; }

  .panel {
    position: absolute; top: 16px; left: 16px; width: 320px;
    background: rgba(14, 18, 28, 0.88); backdrop-filter: blur(12px);
    border: 1px solid rgba(120, 150, 200, 0.18); border-radius: 14px;
    padding: 18px 18px 14px; box-shadow: 0 12px 40px rgba(0,0,0,0.45);
    z-index: 10; max-height: calc(100% - 32px); overflow-y: auto;

  .panel h1 {
    font-size: 17px; font-weight: 600; letter-spacing: 0.4px;

  .row { margin-bottom: 13px; }
  .row label {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 12px; color: #a8b4c8; margin-bottom: 6px; font-weight: 500;
  }
  .row label .val { color: #7ec8ff; font-variant-numeric: tabular-nums; font-weight: 600; }

  input[type="range"] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 5px;
    background: linear-gradient(90deg, #2a3550, #3d4f75); border-radius: 3px; outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 16px; height: 16px;
    background: radial-gradient(circle at 35% 35%, #aee0ff, #4a9fe0);
    border-radius: 50%; cursor: pointer; box-shadow: 0 0 8px rgba(100,180,255,0.7);
    border: 2px solid #0b0e14;
  }
  input[type="range"]::-moz-range-thumb {
    width: 16px; height: 16px;
    background: radial-gradient(circle at 35% 35%, #aee0ff, #4a9fe0);
    border-radius: 50%; cursor: pointer; border: 2px solid #0b0e14;
    box-shadow: 0 0 8px rgba(100,180,255,0.7);
  }

  .freq-display {
    text-align: center; padding: 10px 8px; margin: 4px 0 14px;
    background: rgba(8, 12, 20, 0.7); border-radius: 10px;

  .freq-display .big {
    font-size: 34px; font-weight: 700; color: #eaf4ff;
    font-variant-numeric: tabular-nums; line-height: 1.1;

  .freq-display .big span { font-size: 16px; font-weight: 500; color: #7ec8ff; margin-left: 4px; }
  .freq-display .mode { font-size: 12px; color: #9fb0cc; margin-top: 4px; }
  .freq-display .mode b { color: #b79cff; }
  .freq-display .res {
    display: inline-block; margin-top: 6px; font-size: 10.5px; padding: 2px 10px;
    border-radius: 20px; background: rgba(60,80,120,0.4); color: #7a8aa8;
    border: 1px solid rgba(110,150,210,0.2); transition: all 0.25s;
  }
  .freq-display .res.on {
    background: rgba(80,200,140,0.18); color: #6ee7a8;
    border-color: rgba(110,230,170,0.5); box-shadow: 0 0 12px rgba(90,220,160,0.3);
  }

  .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .presets button {
    flex: 1 1 calc(50% - 6px); padding: 7px 6px; font-size: 11.5px;
    background: rgba(40, 55, 90, 0.55); color: #b8c6de;
    border: 1px solid rgba(110, 150, 210, 0.22); border-radius: 8px;
    cursor: pointer; transition: all 0.15s;
  }
  .presets button:hover { background: rgba(70, 100, 160, 0.65); color: #fff; border-color: rgba(140,180,255,0.5); }
  .presets button.active { background: rgba(90, 130, 220, 0.75); color: #fff; border-color: #7ec8ff; box-shadow: 0 0 10px rgba(100,170,255,0.35); }

  .btn-row { display: flex; gap: 8px; margin-top: 4px; }
  .btn-row button {
    flex: 1; padding: 9px; font-size: 12.5px; font-weight: 600;
    border-radius: 9px; cursor: pointer; border: 1px solid transparent;
    transition: all 0.15s;
  }
  #btnReset {

  .stats {

<body>
<div id="app">
  <div class="panel">
    <h1>◈ Cymatique 3D</h1>
    <div class="sub">Plaque de Chladni — le sable se dépose sur les lignes nodales (zones immobiles) de la plaque vibrante.</div>

    <div class="freq-display">
      <div class="big" id="freqBig">649<span>Hz</span></div>
      <div class="mode" id="modeInfo">Mode <b>(2, 3)</b> — figure de Chladni</div>
      <div class="res" id="resBadge">hors résonance</div>
    </div>

    <div class="row">
      <label>Fréquence <span class="val" id="freqVal">649 Hz</span></label>
      <input type="range" id="freq" min="80" max="3000" value="649" step="1" />
    </div>

    <div class="presets" id="presets"></div>

    <div class="row">
      <label>Amplitude vibration <span class="val" id="ampVal">1.00</span></label>
      <input type="range" id="amp" min="0.2" max="3" value="1" step="0.05" />
    </div>

    <div class="row">
      <label>Grains de sable <span class="val" id="sandVal">12000</span></label>
      <input type="range" id="sandCount" min="2000" max="30000" value="12000" step="1000" />
    </div>

    <div class="row">
      <label>Taille de la plaque <span class="val" id="plateVal">1.00</span></label>
      <input type="range" id="plateSize" min="0.6" max="1.6" value="1" step="0.05" />
    </div>

    <div class="btn-row">
      <button id="btnReset">↺ Réinitialiser sable</button>
      <button id="btnPause">⏸ Pause</button>
    </div>
    <div class="btn-row" style="margin-top:8px">
      <button id="btnSound">🔇 Son coupé</button>
    </div>

    <div class="stats">
      <span>FPS <b id="fps">—</b></span>
      <span>Résonance <b id="resMode">—</b></span>
      <span>λ <b id="lambda">—</b></span>
    </div>
  </div>

  <div class="hint">Glisser = orbiter · Molette = zoom · Clic droit = déplacer</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ═══════════════════ État ═══════════════════ */
const state = {
  freq: 649, // = f(2,3) : démarre directement en résonance
  amp: 1.0,
  sandTarget: 12000,
  plateScale: 1.0,
  paused: false,
  mode: [2, 3],
  resonance: 0, // 0..1 proximité de la fréquence exacte du mode
};

/* Plaque à BORDS LIBRES (vraie plaque de Chladni) :
   Fréquences propres ≈ produit de poutres libre-libre :
   β_k ≈ (k+½)π  →  f ∝ √(βm⁴ + βn⁴)
   (f ∝ (m²+n²) serait le cas bords simplement appuyés — faux ici)
   FREQ_K ≈ plaque d'acier de table : mode (1,1) ≈ 150 Hz */
const FREQ_K = 4.78;

function freqForMode(m, n) {
  const bm = (m + 0.5) * Math.PI;
  const bn = (n + 0.5) * Math.PI;
  return Math.round(FREQ_K * Math.sqrt(bm ** 4 + bn ** 4));
}

function allModes() {
  const list = [];
  for (let m = 1; m <= 12; m++) {
    for (let n = m; n <= 12; n++) { // n ≥ m pour éviter les doublons symétriques
      list.push({ m, n, f: freqForMode(m, n) });
    }
  }
  list.sort((a, b) => a.f - b.f);
  return list;
}
const MODES = allModes();

function nearestMode(f) {
  let best = MODES[0], bestErr = Infinity;
  for (const md of MODES) {
    const err = Math.abs(md.f - f);
    if (err < bestErr) { bestErr = err; best = md; }
  }
  // Largeur de résonance : ~2.5% de la fréquence, avec un plancher de 30 Hz
  // pour que le bas du curseur (modes graves espacés) reste vivant
  const bw = Math.max(30, best.f * 0.025);
  const resonance = Math.max(0, 1 - bestErr / bw);
  return { mode: best, resonance, err: bestErr };
}

/* Figure de Chladni — plaque carrée à bords libres, déplacement w(x,y) :
   m ≠ n (modes "classiques" en croix) :
     w = cos(mπx)cos(nπy) − cos(nπx)cos(mπy)
   m = n (modes diagonaux) : la combinaison antisymétrique s'annule,
     on prend la combinaison symétrique 2·cos(mπx)cos(mπy)
   (formule approchée standard — donne bien les nodaux expérimentaux) */
function chladni(x, y, m, n) {
  const PI = Math.PI;
  if (m === n) {
    return 2 * Math.cos(m * PI * x) * Math.cos(m * PI * y);
  }
  return Math.cos(m * PI * x) * Math.cos(n * PI * y)
       - Math.cos(n * PI * x) * Math.cos(m * PI * y);
}

/* Gradient analytique ∇w (dérivées exactes, vérifiées contre différences finies) */
function chladniGradX(x, y, m, n) {
  const mp = m * Math.PI, np = n * Math.PI;
  if (m === n) return -2 * mp * Math.sin(mp * x) * Math.cos(mp * y);
  return -mp * Math.sin(mp * x) * Math.cos(np * y) + np * Math.sin(np * x) * Math.cos(mp * y);
}
function chladniGradZ(x, y, m, n) {
  const mp = m * Math.PI, np = n * Math.PI;
  if (m === n) return -2 * mp * Math.cos(mp * x) * Math.sin(mp * y);
  return -np * Math.cos(mp * x) * Math.sin(np * y) + mp * Math.cos(np * x) * Math.sin(mp * y);
}

/* ═══════════════════ Three.js ═══════════════════ */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e14);
scene.fog = new THREE.FogExp2(0x0b0e14, 0.045);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(2.6, 2.4, 3.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.target.set(0, 0, 0);
controls.minDistance = 1.5;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI * 0.49;

/* Lumières */
scene.add(new THREE.AmbientLight(0x6a7a9a, 0.55));

const keyLight = new THREE.DirectionalLight(0xfff2dd, 1.6);
keyLight.position.set(4, 7, 3);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -4;
keyLight.shadow.camera.right = 4;
keyLight.shadow.camera.top = 4;
keyLight.shadow.camera.bottom = -4;
keyLight.shadow.bias = -0.0004;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x7eb6ff, 0.5);
fillLight.position.set(-3, 3, -2);
scene.add(fillLight);

const rimLight = new THREE.PointLight(0xb79cff, 18, 12);
rimLight.position.set(-2, 1.5, 2);
scene.add(rimLight);

/* Sol */
const floorGeo = new THREE.CircleGeometry(14, 64);
const floorMat = new THREE.MeshStandardMaterial({ color: 0x12161f, roughness: 0.85, metalness: 0.1 });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.55;
floor.receiveShadow = true;
scene.add(floor);

/* ═══════════════════ Plaque métallique ═══════════════════ */
const PLATE_SEG = 96;
const plateGeo = new THREE.PlaneGeometry(2, 2, PLATE_SEG, PLATE_SEG);
plateGeo.rotateX(-Math.PI / 2);

/* Environnement procédural pour reflets métal */
const pmrem = new THREE.PMREMGenerator(renderer);
let envTex;
{
  const envScene = new THREE.Scene();
  envScene.background = new THREE.Color(0x1a2030);
  const bg = new THREE.Mesh(
    new THREE.SphereGeometry(10, 16, 16),
    new THREE.MeshBasicMaterial({ color: 0x2a3550, side: THREE.BackSide })
  );
  envScene.add(bg);
  const w1 = new THREE.Mesh(new THREE.PlaneGeometry(4, 3), new THREE.MeshBasicMaterial({ color: 0xfff5e0 }));
  w1.position.set(5, 4, 2); w1.lookAt(0, 0, 0); envScene.add(w1);
  const w2 = new THREE.Mesh(new THREE.PlaneGeometry(3, 4), new THREE.MeshBasicMaterial({ color: 0xc0d8ff }));
  w2.position.set(-5, 3, -3); w2.lookAt(0, 0, 0); envScene.add(w2);
  envTex = pmrem.fromScene(envScene, 0.04).texture;
  scene.environment = envTex;
}

const plateMat = new THREE.MeshStandardMaterial({
  color: 0x000000,
  metalness: 0.85,
  roughness: 0.42,
  side: THREE.DoubleSide,
  envMapIntensity: 0.55,
  envMap: envTex,
  polygonOffset: true,
  polygonOffsetFactor: 1,
  polygonOffsetUnits: 1,
});

const plate = new THREE.Mesh(plateGeo, plateMat);
plate.castShadow = false; // évite l'acné d'ombre / clignotement sur plaque fine
plate.receiveShadow = true;
scene.add(plate);

/* Cadre de la plaque */
const frameGeo = new THREE.BoxGeometry(2.12, 0.08, 2.12);
const frameMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, metalness: 0.7, roughness: 0.55 });
const frame = new THREE.Mesh(frameGeo, frameMat);
frame.position.y = -0.055; // sous la plaque : évite le z-fighting quand la plaque est à plat
frame.castShadow = true;
frame.receiveShadow = true;
scene.add(frame);

/* Pastille centrale (point d'excitation) */
const centerDot = new THREE.Mesh(
  new THREE.SphereGeometry(0.035, 16, 16),
  new THREE.MeshStandardMaterial({
    color: 0x7ec8ff, emissive: 0x3a8fd0, emissiveIntensity: 2.5,
    metalness: 0.5, roughness: 0.3,
  })
);
centerDot.position.y = 0.02;
scene.add(centerDot);

/* ═══════════════════ Sable ═══════════════════ */
const MAX_SAND = 30000;
let sandCount = 12000;

/* positions (x,z) sur la plaque [-1,1]² + vélocité */
const px = new Float32Array(MAX_SAND);
const pz = new Float32Array(MAX_SAND);
const vx = new Float32Array(MAX_SAND);
const vz = new Float32Array(MAX_SAND);

function resetSand() {
  for (let i = 0; i < MAX_SAND; i++) {
    px[i] = (Math.random() * 2 - 1) * 0.98;
    pz[i] = (Math.random() * 2 - 1) * 0.98;
    vx[i] = 0;
    vz[i] = 0;
    sandPositions[i * 3 + 0] = px[i];
    sandPositions[i * 3 + 1] = 0.012;
    sandPositions[i * 3 + 2] = pz[i];
  }
  sandGeo.attributes.position.needsUpdate = true;
}

/* Géométrie des points de sable */
const sandGeo = new THREE.BufferGeometry();
const sandPositions = new Float32Array(MAX_SAND * 3);
const sandColors = new Float32Array(MAX_SAND * 3);
sandGeo.setAttribute('position', new THREE.BufferAttribute(sandPositions, 3));
sandGeo.setAttribute('color', new THREE.BufferAttribute(sandColors, 3));
sandGeo.setDrawRange(0, sandCount);
resetSand();

/* Couleur du sable : grain beige/sable avec variation */
for (let i = 0; i < MAX_SAND; i++) {
  const t = 0.85 + Math.random() * 0.15;
  sandColors[i * 3 + 0] = 0.92 * t;
  sandColors[i * 3 + 1] = 0.87 * t;
  sandColors[i * 3 + 2] = 0.72 * t;
}

const sandMat = new THREE.PointsMaterial({
  size: 0.018,
  vertexColors: true,
  sizeAttenuation: true,
});
const sandPoints = new THREE.Points(sandGeo, sandMat);
sandPoints.frustumCulled = false;
scene.add(sandPoints);

/* ═══════════════════ Simulation physique ═══════════════════ */
/* Le sable est secoué proportionnellement à |amplitude locale| et
   dérive vers les nœuds (gradient de |u|² → mouvement vers les minima). */

function simulate(dt, time) {
  const [m, n] = state.mode;
  const amp = state.amp * state.resonance; // pas de force hors résonance

  // Fréquence de secousse visuelle (ralentie : on ne voit pas 500 Hz)
  const shakeFreq = 14 + state.freq * 0.01;
  const shakePhase = Math.sin(time * shakeFreq);

  const jitter = amp * 2.2;
  const drift = amp * 3.5;
  const damp = Math.pow(0.06, dt); // amortissement fort

  for (let i = 0; i < sandCount; i++) {
    const x = px[i];
    const z = pz[i];

    // amplitude locale et gradient analytique (≈5× moins d'évaluations que par différences finies)
    const u = chladni(x, z, m, n);
    const du_dx = chladniGradX(x, z, m, n);
    const du_dz = chladniGradZ(x, z, m, n);

    // force de dérive : -∇(u²)/2 = -u·∇u  (va vers les nœuds)
    const fx = -u * du_dx;
    const fz = -u * du_dz;

    // secousse aléatoire proportionnelle à |u| (sable projeté sur antinœuds)
    const absU = Math.abs(u);
    const jx = (Math.random() - 0.5) * jitter * absU;
    const jz = (Math.random() - 0.5) * jitter * absU;

    // légère oscillation globale pour "vivre"
    const ox = Math.sin(time * shakeFreq + i * 0.7) * 0.15 * absU * amp;
    const oz = Math.cos(time * shakeFreq * 1.3 + i * 0.3) * 0.15 * absU * amp;

    vx[i] = (vx[i] + (fx * drift + jx + ox) * dt) * damp;
    vz[i] = (vz[i] + (fz * drift + jz + oz) * dt) * damp;

    let nx = x + vx[i] * dt;
    let nz = z + vz[i] * dt;

    // rebord : réflexion élastique
    if (nx > 0.99) { nx = 0.99; vx[i] *= -0.5; }
    if (nx < -0.99) { nx = -0.99; vx[i] *= -0.5; }
    if (nz > 0.99) { nz = 0.99; vz[i] *= -0.5; }
    if (nz < -0.99) { nz = -0.99; vz[i] *= -0.5; }

    px[i] = nx;
    pz[i] = nz;

    // hauteur : colle à la déformation réelle de la plaque + petit rebond aux antinœuds
    const plateH = chladni(nx, nz, m, n) * 0.015 * state.amp
                 * (0.25 + 0.75 * state.resonance) * shakePhase;
    const bounce = absU * amp * 0.008 * Math.abs(shakePhase);
    sandPositions[i * 3 + 0] = nx;
    sandPositions[i * 3 + 1] = 0.012 + plateH + bounce;
    sandPositions[i * 3 + 2] = nz;
  }
  sandGeo.attributes.position.needsUpdate = true;
}

/* Déformation de la plaque (normales analytiques — plus de computeVertexNormals par frame) */
function deformPlate(time) {
  const [m, n] = state.mode;
  const pos = plateGeo.attributes.position;
  const nor = plateGeo.attributes.normal;
  const arr = pos.array;
  const narr = nor.array;
  // chladni ∈ [−2,2] → on normalise pour limiter le débattement
  const scale = 0.03 * state.amp * (0.25 + 0.75 * state.resonance);
  const phase = Math.sin(time * (14 + state.freq * 0.01));
  const c = 0.5 * scale * phase; // pente : ∂y/∂x = c · ∂w/∂x

  for (let i = 0; i < pos.count; i++) {
    const x = arr[i * 3 + 0];
    const z = arr[i * 3 + 2];
    arr[i * 3 + 1] = (chladni(x, z, m, n) * 0.5) * scale * phase;
    // normale exacte d'un champ de hauteur : n ∝ (−∂y/∂x, 1, −∂y/∂z)
    const dydx = c * chladniGradX(x, z, m, n);
    const dydz = c * chladniGradZ(x, z, m, n);
    const inv = 1 / Math.sqrt(1 + dydx * dydx + dydz * dydz);
    narr[i * 3 + 0] = -dydx * inv;
    narr[i * 3 + 1] = inv;
    narr[i * 3 + 2] = -dydz * inv;
  }
  pos.needsUpdate = true;
  nor.needsUpdate = true;
}

/* ═══════════════════ UI ═══════════════════ */
const $ = (id) => document.getElementById(id);
const freqInput = $('freq');
const ampInput = $('amp');
const sandInput = $('sandCount');
const plateInput = $('plateSize');
const presetsEl = $('presets');

/* Presets : modes classiques de Chladni */
const PRESETS = [
  { label: '(1,1)', m: 1, n: 1 },
  { label: '(1,2)', m: 1, n: 2 },
  { label: '(2,2)', m: 2, n: 2 },
  { label: '(2,3)', m: 2, n: 3 },
  { label: '(3,3)', m: 3, n: 3 },
  { label: '(3,4)', m: 3, n: 4 },
  { label: '(4,5)', m: 4, n: 5 },
  { label: '(5,6)', m: 5, n: 6 },
];
for (const p of PRESETS) {
  const btn = document.createElement('button');
  const f = freqForMode(p.m, p.n);
  btn.textContent = `${p.label} · ${f} Hz`;
  btn.dataset.f = f;
  btn.addEventListener('click', () => {
    freqInput.value = f;
    updateFreq(f);
  });
  presetsEl.appendChild(btn);
}

function updateFreq(f) {
  state.freq = Number(f);
  const { mode, resonance } = nearestMode(state.freq);
  state.mode = [mode.m, mode.n];
  state.resonance = resonance;

  $('freqBig').innerHTML = `${state.freq}<span>Hz</span>`;
  $('freqVal').textContent = `${state.freq} Hz`;
  $('modeInfo').innerHTML = `Mode <b>(${mode.m}, ${mode.n})</b> — figure de Chladni`;

  const badge = $('resBadge');
  if (resonance > 0.7) {
    badge.textContent = '● résonance forte';
    badge.classList.add('on');
  } else if (resonance > 0.35) {
    badge.textContent = '◐ proche résonance';
    badge.classList.remove('on');
  } else {
    badge.textContent = 'hors résonance';
    badge.classList.remove('on');
  }

  $('resMode').textContent = `${Math.round(resonance * 100)}%`;
  // longueur d'onde approximative sur plaque de 1 m
  const lambda = 2.0 / Math.max(mode.m, mode.n);
  $('lambda').textContent = `${lambda.toFixed(2)} m`;

  // preset actif
  for (const btn of presetsEl.children) {
    btn.classList.toggle('active', Number(btn.dataset.f) === freqForMode(mode.m, mode.n) && Math.abs(state.freq - Number(btn.dataset.f)) < 2);
  }
}

freqInput.addEventListener('input', (e) => updateFreq(e.target.value));
ampInput.addEventListener('input', (e) => {
  state.amp = Number(e.target.value);
  $('ampVal').textContent = state.amp.toFixed(2);
});
sandInput.addEventListener('input', (e) => {
  state.sandTarget = Math.min(MAX_SAND, Math.max(0, Number(e.target.value)));
  $('sandVal').textContent = state.sandTarget;
  if (state.sandTarget > sandCount) {
    // grains réactivés : réinit physique ET buffer GPU (sinon fantôme ancienne figure)
    for (let i = sandCount; i < state.sandTarget; i++) {
      px[i] = (Math.random() * 2 - 1) * 0.98;
      pz[i] = (Math.random() * 2 - 1) * 0.98;
      vx[i] = 0;
      vz[i] = 0;
      sandPositions[i * 3 + 0] = px[i];
      sandPositions[i * 3 + 1] = 0.012;
      sandPositions[i * 3 + 2] = pz[i];
    }
    sandGeo.attributes.position.needsUpdate = true;
  }
  sandCount = state.sandTarget;
  sandGeo.setDrawRange(0, sandCount);
});
plateInput.addEventListener('input', (e) => {
  state.plateScale = Number(e.target.value);
  $('plateVal').textContent = state.plateScale.toFixed(2);
  plate.scale.set(state.plateScale, 1, state.plateScale);
  frame.scale.set(state.plateScale, 1, state.plateScale);
  // le sable suit la taille de la plaque
  sandPoints.scale.set(state.plateScale, 1, state.plateScale);
  centerDot.scale.setScalar(state.plateScale);
});

$('btnReset').addEventListener('click', resetSand);
$('btnPause').addEventListener('click', () => {
  state.paused = !state.paused;
  $('btnPause').textContent = state.paused ? '▶ Reprendre' : '⏸ Pause';
});

updateFreq(state.freq);

/* ═══════════════════ Son (Web Audio) ═══════════════════ */
let audioCtx = null;
let audioOsc = null;
let audioGain = null;
let soundOn = false;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  audioOsc = audioCtx.createOscillator();
  audioGain = audioCtx.createGain();
  audioOsc.type = 'sine';
  audioOsc.frequency.value = state.freq;
  audioGain.gain.value = 0;
  audioOsc.connect(audioGain);
  audioGain.connect(audioCtx.destination);
  audioOsc.start();
}

function setSound(on) {
  soundOn = on;
  const btn = $('btnSound');
  if (on) {
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    btn.textContent = '🔊 Son actif';
    btn.style.background = 'linear-gradient(135deg, #1d6b4a, #145238)';
    btn.style.color = '#c8ffe0';
    btn.style.borderColor = 'rgba(110,230,170,0.45)';
  } else {
    if (audioGain) audioGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.05);
    btn.textContent = '🔇 Son coupé';
    btn.style.background = '';
    btn.style.color = '';
    btn.style.borderColor = '';
  }
}

function updateSound() {
  if (!soundOn || !audioCtx) return;
  const t = audioCtx.currentTime;
  audioOsc.frequency.setTargetAtTime(state.freq, t, 0.03);
  // volume : silence hors résonance, soutenu en résonance
  const vol = state.paused ? 0 : 0.001 + 0.14 * state.amp * state.resonance * state.resonance;
  audioGain.gain.setTargetAtTime(vol, t, 0.08);
}

$('btnSound').addEventListener('click', () => setSound(!soundOn));

/* ═══════════════════ Boucle ═══════════════════ */
let last = performance.now();
let frames = 0;
let fpsTime = 0;

function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const time = now / 1000;

  if (!state.paused) {
    simulate(dt, time);
    deformPlate(time);
    // pastille centrale pulse (conserve la taille de la plaque)
    const s = state.plateScale * (1 + 0.3 * state.resonance * Math.sin(time * 20));
    centerDot.scale.setScalar(s);
  }
  updateSound();

  controls.update();
  renderer.render(scene, camera);

  frames++;
  fpsTime += dt;
  if (fpsTime >= 0.5) {
    $('fps').textContent = Math.round(frames / fpsTime);
    frames = 0;
    fpsTime = 0;
  }
}
requestAnimationFrame(animate);

/* Resize */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
